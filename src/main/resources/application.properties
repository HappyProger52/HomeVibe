spring.application.name=homevibe
server.address=127.0.0.1
server.port=${PORT:3000}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${HOMEVIBE_SECURE_COOKIE:false}
server.error.include-message=never
server.error.include-stacktrace=never
homevibe.bookings-file=${HOMEVIBE_BOOKINGS_FILE:data/bookings.json}
homevibe.owner-password=${HOMEVIBE_OWNER_PASSWORD:}
homevibe.owner-login=${HOMEVIBE_OWNER_LOGIN:owner}
homevibe.customers-file=${HOMEVIBE_CUSTOMERS_FILE:data/customers.json}
homevibe.houses-file=${HOMEVIBE_HOUSES_FILE:data/houses.json}
homevibe.uploads-directory=${HOMEVIBE_UPLOADS_DIRECTORY:data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-float-as-int=false
homevibe.reviews-file=${HOMEVIBE_REVIEWS_FILE:data/reviews.json}
